plugins {
    id 'com.android.application'
}

android {
    namespace 'com.deepseek.petoverlay'
    compileSdk 36

    defaultConfig {
        applicationId 'com.deepseek.petoverlay'
        minSdk 26
        targetSdk 33
        versionCode 42
        versionName '1.3.0'
    }

    // 沿用现有目录结构：源码在 app/src，清单在 app/AndroidManifest.xml
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
