plugins {
    id 'com.android.application'
}

android {
    namespace 'com.deepseek.petoverlay'
    compileSdk 33

    defaultConfig {
        applicationId 'com.deepseek.petoverlay'
        minSdk 26
        targetSdk 28
        versionCode 2
        versionName '1.2'
    }

    // 沿用现有的目录结构：源码在 app/src，清单在 app/AndroidManifest.xml
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
